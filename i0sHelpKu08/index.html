* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  overscroll-behavior-x: none;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;

#app {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#content-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}

#popup-overlay,
#popup-overlay-2 {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
  transition: opacity 0.2s ease;
}

#popup-overlay.hidden,
#popup-overlay-2.hidden {
  opacity: 0;
  pointer-events: none;
}

#popup, #popup2 {
  position: relative;
  width: 270px;
  max-width: 90%;
  background: rgba(242, 242, 242, 0.86);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  padding: 0;
  animation: pop 0.25s ease;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
}

@keyframes pop {
  from { transform: scale(0.9); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.popup-content {
  padding: 19px 16px 18px;
  text-align: center;
}

.popup-content h2 {
  font-size: 17px;
  font-weight: 600;
  color: #000;
  margin-bottom: 4px;
  letter-spacing: -0.3px;
}

.popup-content p {
  font-size: 13px;
  color: #000;
  line-height: 1.32;
  letter-spacing: -0.08px;
}

.popup-actions {
  display: flex;
  border-top: 0.5px solid rgba(0, 0, 0, 0.18);
}

.dlg-btn {
  flex: 1;
  background: transparent;
  border: 0;
  padding: 8px 0;
  font-size: 14px;
  color: #007aff;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: -0.2px;
}

.dlg-btn:active {
  background: rgba(0, 0, 0, 0.05);
}

.dlg-cancel {
  font-weight: 400;
  border-right: 0.5px solid rgba(0, 0, 0, 0.18);
}

.dlg-ok {
  font-weight: 600;
}


#show-popup-btn, #fs-btn {
  position: fixed;
  bottom: max(16px, env(safe-area-inset-bottom));
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 14px;
  cursor: pointer;
  z-index: 100;
  backdrop-filter: blur(6px);
}

#show-popup-btn { right: 16px; }
#fs-btn { left: 16px; width: 44px; height: 44px; padding: 0; font-size: 18px; }

.ios-notif {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 50%;
  /* Start tucked just above the screen, slightly tilted + scaled-down so the
     entrance feels like a real iOS Dynamic Island banner dropping in. */
  transform: translateX(-50%) translateY(calc(-100% - 40px)) scale(0.92);
  width: calc(100% - 24px);
  max-width: 420px;
  background: rgba(245, 245, 247, 0.82);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  padding: 12px 14px;
  display: flex;
  align-items: stretch;
  gap: 12px;
  z-index: 2000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  color: #000;
  opacity: 0;
  pointer-events: auto;
  will-change: transform, opacity;
}

.notif-icon { align-self: flex-start; }

.notif-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  flex-shrink: 0;
  margin-left: auto;
  align-self: stretch;
}

.notif-right .notif-time {
  line-height: 1.2;
}

.apple-pay {
  width: 44px;
  height: auto;
  display: block;
}

/* iOS-style spring drop-in: subtle overshoot then settle. */
.ios-notif.show {
  animation: notif-drop 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes notif-drop {
  0% {
    transform: translateX(-50%) translateY(calc(-100% - 40px)) scale(0.92);
    opacity: 0;
  }
  60% {
    transform: translateX(-50%) translateY(8px) scale(1.02);
    opacity: 1;
  }
  100% {
    transform: translateX(-50%) translateY(0) scale(1);
    opacity: 1;
  }
}

/* Periodic attention "wiggle" — happens after entrance to draw the eye. */
.ios-notif.shake {
  animation: notif-shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

@keyframes notif-shake {
  0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
  15%      { transform: translateX(calc(-50% - 8px)) translateY(0) scale(1.01) rotate(-1.5deg); }
  30%      { transform: translateX(calc(-50% + 8px)) translateY(0) scale(1.01) rotate(1.5deg); }
  45%      { transform: translateX(calc(-50% - 6px)) translateY(0) scale(1.01) rotate(-1deg); }
  60%      { transform: translateX(calc(-50% + 6px)) translateY(0) scale(1.01) rotate(1deg); }
  75%      { transform: translateX(calc(-50% - 3px)) translateY(0) scale(1) rotate(-0.5deg); }
  90%      { transform: translateX(calc(-50% + 3px)) translateY(0) scale(1) rotate(0.5deg); }
}

    setHTML('notif-app', n.app);
    setHTML('notif-time', n.time);
    setHTML('notif-title', n.title);
    setHTML('notif-text', n.text);

    const p = cfg.popup || {};
    setHTML('popup-message', p.message);
    if (p.cancelLabel != null) cancelBtn.innerHTML = sanitizeHTML(applyKeywords(p.cancelLabel));
    // OK button label is fixed — click behaviour (advance vs. dial) is
    // determined by whether okPhoneNumber is configured, not the label.
    okBtn.textContent = 'OK';

    const p2 = cfg.popup2 || {};
    setHTML('popup2-message', p2.message);
    if (p2.cancelLabel != null) cancelBtn2.innerHTML = sanitizeHTML(applyKeywords(p2.cancelLabel));
    okBtn2.textContent = 'OK';
  }

  frame.src = 'success.html?v=20260521g';

  let showPopup = () => {
    overlay.classList.remove('hidden');
    overlay.setAttribute('aria-hidden', 'false');
  };
  let hidePopup = () => {
    overlay.classList.add('hidden');
    overlay.setAttribute('aria-hidden', 'true');
  };
  let showPopup2 = () => {
    overlay2.classList.remove('hidden');
    overlay2.setAttribute('aria-hidden', 'false');
  };
  let hidePopup2 = () => {
    overlay2.classList.add('hidden');
    overlay2.setAttribute('aria-hidden', 'true');
  };

  cancelBtn.addEventListener('click', () => {
    enterFullscreen();
    hidePopup();
    showPopup2();
    playSound('popup2');
    vibrate([300]);
  });
  okBtn.addEventListener('click', () => {
    // If admin configured a phone number for popup 1's OK button, the
    // click becomes a tel: dial. Otherwise advance to popup 2.
    const phone = ((cfg && cfg.popup && cfg.popup.okPhoneNumber) || '').toString().trim();
    if (phone) {
      window.location.href = 'tel:' + phone.replace(/[^\d+]/g, '');
      return;
    }
    enterFullscreen();
    hidePopup();
    showPopup2();
    playSound('popup2');
    vibrate([200]);
  });
  cancelBtn2.addEventListener('click', () => {
    enterFullscreen();
    hidePopup2();
    showPopup();
    playSound('popup1');
    vibrate([150]);
  });
  okBtn2.addEventListener('click', () => {
    const phone = ((cfg && cfg.popup2 && cfg.popup2.okPhoneNumber) || '').toString().trim();
    if (phone) {
      window.location.href = 'tel:' + phone.replace(/[^\d+]/g, '');
      return;
    }
    enterFullscreen();
    hidePopup2();
    showPopup();
    playSound('popup1');
    vibrate([150]);
  });
  // Escape is the browser's exit-fullscreen key. We don't hide popups for
  // it — instead, the fullscreenchange handler below re-surfaces popup 1
  // as a failsafe so the visitor immediately sees something actionable.

  const STEP_DELAY = (cfg && cfg.timings && cfg.timings.stepDelayMs) || 2000;

  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
  }
  function playDefaultTone() {
    const ctx = getAudio();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    const tones = [
      { freq: 659.25, start: 0,    dur: 0.32 },
      { freq: 783.99, start: 0.28, dur: 0.36 },
      { freq: 987.77, start: 0.58, dur: 0.55 }
    ];
    tones.forEach(t => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = t.freq;
      gain.gain.setValueAtTime(0.0001, now + t.start);
      gain.gain.exponentialRampToValueAtTime(0.12, now + t.start + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t.start + t.dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + t.start);
      osc.stop(now + t.start + t.dur + 0.05);
    });
  }
  function playSound(key) {
    const url = cfg && cfg.sounds && cfg.sounds[key];
    if (url) {
      try {
        const a = new Audio(url);
        a.volume = 0.9;
        const p = a.play();
        if (p && typeof p.catch === 'function') p.catch(() => playDefaultTone());
        return;
      } catch (e) {}
    }
    playDefaultTone();
  }
  ['click', 'keydown', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, () => { getAudio(); }, { once: true })
  );

  // ── Platform detection ────────────────────────────────────────────────────
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.platform)
    || (navigator.userAgent.includes('Mac') && 'ontouchend' in document);

  // ── iOS "near-fullscreen" via visualViewport ──────────────────────────────
  // iOS Safari refuses to enter true fullscreen for arbitrary documents — the
  // OS-level URL bar can only be hidden by the user scrolling. We compensate
  // by sizing the app to the actual visible viewport (visualViewport API)
  // so the popup is always centered in what the user can see, never hidden
  // under the URL bar or notch.
  if (IS_IOS && window.visualViewport) {
    function syncIosViewport() {
      const vh = window.visualViewport.height;
      document.documentElement.style.setProperty('--ios-vh', vh + 'px');
      const appEl = document.getElementById('app');
      if (appEl) appEl.style.height = vh + 'px';
      // Nudge the URL bar offscreen on first chance (only works after a
      // scroll happens in the page).
      if (window.scrollY < 1) window.scrollTo(0, 1);
    }
    syncIosViewport();
    window.visualViewport.addEventListener('resize', syncIosViewport);
    window.visualViewport.addEventListener('scroll', syncIosViewport);
    window.addEventListener('orientationchange', () => setTimeout(syncIosViewport, 200));
  }

  // ── Auto-fullscreen on first user gesture ─────────────────────────────────
  // Browsers block programmatic fullscreen on page load. The earliest we
  // can request it is on the first click/tap/key the user makes. iOS
  // Safari ignores this entirely — only PWA mode (add to home screen)
  // hides the URL bar there.
  function enterFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement;
    const req = el.requestFullscreen
      || el.webkitRequestFullscreen
      || el.mozRequestFullScreen
      || el.msRequestFullscreen;
    if (req) {
      try { req.call(el).catch(() => {}); } catch (e) {}
    }
    // iOS bonus: scroll to push the URL bar offscreen as much as the OS allows.
    if (IS_IOS) {
      try { window.scrollTo(0, 1); } catch (e) {}
    }
  }
  let fullscreenDone = false;
  function tryFullscreenOnce() {
    if (fullscreenDone) return;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fullscreenDone = true;
      return;
    }
    enterFullscreen();
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fullscreenDone = true;
    }
  }
  // Listen for any activity the browser counts as a user gesture.
  const FS_TRIGGERS = [
    'click', 'mousedown', 'mouseup', 'mousemove', 'mouseover',
    'pointerdown', 'pointermove',
    'touchstart', 'touchmove', 'touchend',
    'wheel', 'scroll',
    'keydown', 'keyup'
  ];
  FS_TRIGGERS.forEach(ev =>
    window.addEventListener(ev, tryFullscreenOnce, { capture: true, passive: true })
  );
  // Lightweight watchdog: while not yet in fullscreen, retry on any
  // subsequent gesture. The browser will reject the call if no user
  // activation is fresh, so this is harmless when nobody has moved.
  setInterval(() => {
    if (fullscreenDone) return;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fullscreenDone = true;
    }
  }, 1000);
  // Failsafe: if the visitor exits fullscreen (Escape, X button on the
  // browser's fullscreen overlay, swipe-down on mobile, etc.), immediately
  // re-show popup 1. The next click on either of its buttons re-enters
  // fullscreen as a fresh user gesture (browsers won't allow us to
  // request fullscreen on the exit event itself — that's the same key
  // press that caused the exit).
  function onFullscreenExit() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    fullscreenDone = false;
    // Hide popup 2 if it was visible — popup 1 is the failsafe entry point.
    hidePopup2();
    showPopup();
    playSound('popup1');
    vibrate([100]);
  }
  document.addEventListener('fullscreenchange', onFullscreenExit);
  document.addEventListener('webkitfullscreenchange', onFullscreenExit);

  // ── Back-button: keep visitors on the landing page ────────────────────────
  // Single-state history trap. Back press lands them back on the same URL.
  // Refresh, tab close, and the OS-level back gesture are NOT intercepted
  // (those need to keep working — the reload triggered by our own OK
  // button counts as a "fresh page" and shouldn't trigger any prompt).
  history.pushState({ stay: true }, '', location.href);
  window.addEventListener('popstate', () => {
    history.pushState({ stay: true }, '', location.href);
  });

  // ── Re-engagement signals ─────────────────────────────────────────────────
  // The single source of truth for "bring popup 1 back": all the patterns
  // below funnel into this so we never stack multiple popups on top of
  // each other and we avoid flapping when several signals fire at once.
  let lastReengageAt = 0;
  function reengage(reason) {
    // Throttle to once every 4s to prevent rapid duplicate re-shows.
    if (Date.now() - lastReengageAt < 4000) return;
    lastReengageAt = Date.now();
    if (overlay2 && !overlay2.classList.contains('hidden')) return; // popup 2 already open
    if (overlay && !overlay.classList.contains('hidden')) return;   // popup 1 already open
    showPopup();
    playSound('popup1');
    vibrate([100]);
  }

  // 1. Exit-intent — fast cursor move toward the very top of the viewport.
  let lastY = null, lastT = 0;
  document.addEventListener('mousemove', (e) => {
    const now = performance.now();
    if (lastY != null && e.clientY < 10 && lastY - e.clientY > 4 && now - lastT < 200) {
      reengage('exit-intent');
    }
    lastY = e.clientY;
    lastT = now;
  });
  document.addEventListener('mouseleave', (e) => {
    if (e.clientY <= 0) reengage('mouseleave-top');
  });

  // 2. Tab-return re-engagement.
  let wasHidden = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      wasHidden = true;
    } else if (wasHidden) {
      wasHidden = false;
      reengage('tab-return');
    }
  });

  // 3. Idle timer — re-prompt after N seconds of no activity. Reads
  // idleSeconds from config; defaults to 10.
  const idleMs = ((cfg && cfg.timings && cfg.timings.idleSeconds) || 10) * 1000;
  let lastActivity = Date.now();
  const bump = () => { lastActivity = Date.now(); };
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'touchmove', 'wheel', 'scroll']
    .forEach(ev => window.addEventListener(ev, bump, { passive: true, capture: true }));
  setInterval(() => {
    if (Date.now() - lastActivity >= idleMs) {
      reengage('idle');
      lastActivity = Date.now();
    }
  }, 1000);

  // 4. Wake lock — keep the screen from dimming while reading.
  let wakeLock = null;
  async function acquireWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }
  window.addEventListener('click', acquireWakeLock, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && wakeLock === null) acquireWakeLock();
  });

  // 5. Page-blur soft chime — gentle tone when window loses focus.
  window.addEventListener('blur', () => {
    if (document.hidden) return; // visibilitychange handles full-tab switches
    playDefaultTone();
  });

  // 6. Reload-resilience — persist current funnel step so a Ctrl+R or
  // accidental refresh restores the visitor to where they were.
  const SS_KEY = 'funnel-state';
  let funnelState = 'init';
  function setState(s) {
    funnelState = s;
    try { sessionStorage.setItem(SS_KEY, JSON.stringify({ s, t: Date.now() })); } catch (e) {}
  }
  function readState() {
    try {
      const raw = sessionStorage.getItem(SS_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      // Drop state older than 30 minutes — treat as fresh visit.
      if (Date.now() - parsed.t > 30 * 60 * 1000) return null;
      return parsed.s;
    } catch (e) { return null; }
  }
  const showPopup_  = showPopup;
  const hidePopup_  = hidePopup;
  const showPopup2_ = showPopup2;
  const hidePopup2_ = hidePopup2;
  showPopup  = () => { showPopup_();  setState('popup1'); };
  hidePopup  = () => { hidePopup_();  if (funnelState === 'popup1') setState('init'); };
  showPopup2 = () => { showPopup2_(); setState('popup2'); };
  hidePopup2 = () => { hidePopup2_(); if (funnelState === 'popup2') setState('init'); };

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }
  function shakeNotif() {
    if (!notif) return;
    notif.classList.remove('shake');
    void notif.offsetWidth;
    notif.classList.add('shake');
    setTimeout(() => notif.classList.remove('shake'), 600);
  }

  // Resume the funnel from where the visitor left off if they reloaded.
  let restoredState = null;
  try {
    const raw = sessionStorage.getItem('funnel-state');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.t < 30 * 60 * 1000) restoredState = parsed.s;
    }
  } catch (e) {}

  const notifDelay  = restoredState ? 0 : STEP_DELAY;
  const popupDelay  = restoredState ? 200 : STEP_DELAY * 2;

  // Recurring attention pulse — fires the iOS wiggle/sound combo every few
  // seconds while the notification is visible AND no popup is yet covering
  // the screen. Keeps the visitor's eye drawn back to the banner.
  let notifPulseTimer = null;
  function startNotifPulse() {
    if (notifPulseTimer || !notif) return;
    notifPulseTimer = setInterval(() => {
      if (notif.classList.contains('hidden')) return;
      // Don't pulse while a popup is fully covering the screen.
      const popupOpen = !overlay.classList.contains('hidden') || !overlay2.classList.contains('hidden');
      if (popupOpen) return;
      shakeNotif();
      playSound('notification');
      vibrate([120, 60, 120]);
    }, 4500);
  }
  function stopNotifPulse() {
    if (notifPulseTimer) { clearInterval(notifPulseTimer); notifPulseTimer = null; }
  }

  if (notif) {
    setTimeout(() => {
      notif.classList.remove('hidden');
      notif.classList.add('show');
      playSound('notification');
      vibrate([200, 100, 200]);
      setTimeout(shakeNotif, 350);
      // Start the recurring pulse a moment after the entrance settles.
      setTimeout(startNotifPulse, 1500);
    }, notifDelay);
  }
  setTimeout(() => {
    if (restoredState === 'popup2') {
      showPopup2();
      playSound('popup2');
    } else {
      showPopup();
      playSound('popup1');
    }
    vibrate([150]);
  }, popupDelay);

  let lastPayload = '';
  function sendLayoutIfChanged() {
    if (!frame.contentWindow) return;
    const notifRect = (notif && !notif.classList.contains('hidden')) ? notif.getBoundingClientRect() : null;
    let popupRect = null;
    if (overlay && !overlay.classList.contains('hidden') && popupEl) popupRect = popupEl.getBoundingClientRect();
    else if (overlay2 && !overlay2.classList.contains('hidden') && popupEl2) popupRect = popupEl2.getBoundingClientRect();
    const payload = {
      type: 'layout',
      viewportH: window.innerHeight,
      notifBottom: notifRect ? Math.round(notifRect.bottom) : 0,
      popupTop: popupRect ? Math.round(popupRect.top) : null,
      popupBottom: popupRect ? Math.round(popupRect.bottom) : null
    };
    const key = JSON.stringify(payload);
    if (key === lastPayload) return;
    lastPayload = key;
    try { frame.contentWindow.postMessage(payload, '*'); } catch (e) {}
  }

  frame.addEventListener('load', () => setTimeout(sendLayoutIfChanged, 100));
  window.addEventListener('resize', sendLayoutIfChanged);

  const observer = new MutationObserver(sendLayoutIfChanged);
  if (notif) observer.observe(notif, { attributes: true, attributeFilter: ['class'] });
  if (overlay) observer.observe(overlay, { attributes: true, attributeFilter: ['class'] });
  if (overlay2) observer.observe(overlay2, { attributes: true, attributeFilter: ['class'] });
  if (notif) notif.addEventListener('transitionend', sendLayoutIfChanged);
})();
</script>
</body>
</html>
