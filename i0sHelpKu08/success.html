      inner.style.setProperty('--scale', scale.toFixed(3));

    function applyLayout(d) {
      const vh = d.viewportH || window.innerHeight;
      const notifBottom = d.notifBottom || 0;
      const popupVisible = d.popupTop != null;

      const topZoneTop = Math.max(16, notifBottom + 12);

      let topZoneHeight, bottomZoneTop;

        topZoneHeight = Math.max(40, d.popupTop - 12 - topZoneTop);
        bottomZoneTop = d.popupBottom + 12;
      } else {
        topZoneHeight = Math.max(40, topInner.scrollHeight + 8);
        bottomZoneTop = topZoneTop + topZoneHeight + 16;

      document.body.style.setProperty('--top-zone-top', topZoneTop + 'px');
      document.body.style.setProperty('--top-zone-height', topZoneHeight + 'px');
      document.body.style.setProperty('--bottom-zone-top', bottomZoneTop + 'px');

      fit(topInner, topZoneHeight);
      fit(bottomInner, Math.max(40, vh - bottomZoneTop - 16));
